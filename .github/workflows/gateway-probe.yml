# Temporary: which models accept Codex 0.167's real request through the
# OpenCode Responses endpoint with this repo's key. Prints status codes only.
name: Gateway probe (Codex)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          for m in glm-5.3 kimi-k3 deepseek-v4.1-flash minimax-m3 qwen3.8-max gpt-6.1-sol gpt-5.5 grok-4.7 big-pickle; do
            jq --arg m "$m" '.model=$m' .github/probe/codex-request.json > body.json
            code=$(curl -s -m 90 -o out.txt -w '%{http_code}' https://opencode.ai/inference/openai/v1/responses \
              -H "authorization: Bearer $KEY" -H 'content-type: application/json' -H 'accept: text/event-stream' -d @body.json)
            kinds=$(grep -oE '"type":"(response\.(completed|failed|output_item\.done)|error)"' out.txt | sort | uniq -c | tr '\n' ' ')
            calls=$(grep -oE '"type":"function_call"[^}]{0,80}"name":"[a-z_]+"' out.txt | grep -oE '"name":"[a-z_]+"' | sort -u | tr '\n' ' ')
            err=$(grep -oE '"message":"[^"]{0,140}' out.txt | head -1)
            echo "$m -> $code | $kinds| calls: $calls| $err"
          done
