# Temporary: which models answer a Claude Code-shaped request through the
# OpenCode Anthropic endpoint with this repo's key. Prints status codes only.
name: Gateway probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - run: |
          for m in claude-sonnet-5-5 claude-haiku-5-5 kimi-k3 kimi-k2.7-code glm-5.3 minimax-m3 qwen3.8-max deepseek-v4.1-flash gpt-5.5 gemini-3.8-flash; do
            body=$(jq -nc --arg m "$m" '{model:$m,max_tokens:20,
              system:[{type:"text",text:"Reply with ok.",cache_control:{type:"ephemeral"}}],
              tools:[{name:"Read",description:"Read a file",input_schema:{type:"object",properties:{file_path:{type:"string"}},required:["file_path"]}}],
              messages:[{role:"user",content:[{type:"text",text:"Say ok",cache_control:{type:"ephemeral"}}]}]}')
            code=$(curl -s -m 60 -o out.json -w '%{http_code}' https://opencode.ai/inference/anthropic/v1/messages \
              -H "authorization: Bearer $KEY" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' -d "$body")
            echo "$m -> $code $(jq -c '.error.message // (.content[0].text // .content[0].type)' out.json 2>/dev/null | cut -c1-140)"
          done
