# Temporary: integration test of the claude-code harness on the claude-code-harness branch.
# Shadow mode, and only for PRs into harness-test-base. Remove after the test.
name: Harness test (claude-code)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  checks: read
  actions: read

jobs:
  score:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: alfonsograziano/needs-human-review@claude-code-harness
        with:
          mode: shadow
          comment: 'true'
          base-branches: harness-test-base
          api-key: ${{ secrets.OPENCODE_API_KEY }}
          harness: claude-code
          harness-settings: |
            model: claude-sonnet-5-5
            base-url: https://opencode.ai/inference/anthropic
          protected-paths: |
            src/payments/**
