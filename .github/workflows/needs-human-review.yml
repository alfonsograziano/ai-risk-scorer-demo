name: Needs Human Review
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  checks: read
  actions: read

concurrency:
  group: needs-human-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  score:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: alfonsograziano/needs-human-review@v2
        with:
          mode: autonomous
          # An OpenCode key: Claude Code reaches glm-5.3 through OpenCode's Anthropic endpoint.
          api-key: ${{ secrets.API_KEY }}
          harness: claude-code
          model: glm-5.3
          harness-settings: |
            base-url: https://opencode.ai/inference/anthropic
          protected-paths: |
            src/payments/**
