name: OpenCode smoke test
on:
  workflow_dispatch:
    inputs:
      version:
        default: 2.2.5
      model:
        default: opencode/deepseek-v4.1-flash
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_DISABLE_AUTOUPDATE: '1'
      AGENT: '{"risk-scorer":{"mode":"primary","description":"test","system":"Reply in one short line.","steps":5,"permissions":[{"action":"*","resource":"*","effect":"deny"},{"action":"read","resource":"*","effect":"allow"}]}}'
    steps:
      - name: Install OpenCode
        run: |
          dir="$RUNNER_TEMP/opencode"; mkdir -p "$dir"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${{ inputs.version }}/opencode-linux-x64.tar.gz" | tar -xz -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Try each config
        run: |
          mkdir w && cd w && echo hi > a.txt
          try() {
            echo "=== $1"
            OPENCODE_CONFIG_CONTENT="$2" OPENCODE_DISABLE_PROJECT_CONFIG=1 PWD="$PWD" opencode run --standalone --agent risk-scorer --model "${{ inputs.model }}" --format json "Say ok" 2>&1 | grep -oE '"(text|message)":"[^"]{0,120}' | head -3
          }
          try "agent only" "{\"agents\":$AGENT}"
          try "agent + mcp/skill/plugin policies" "{\"agents\":$AGENT,\"policies\":[{\"action\":\"mcp.use\",\"resource\":\"*\",\"effect\":\"deny\"},{\"action\":\"skill.use\",\"resource\":\"*\",\"effect\":\"deny\"},{\"action\":\"plugin.use\",\"resource\":\"*\",\"effect\":\"deny\"}]}"
          try "agent + integration policy" "{\"agents\":$AGENT,\"policies\":[{\"action\":\"integration.use\",\"resource\":\"*\",\"effect\":\"deny\"}]}"
